# 用语检查词表：口语 → 规范表述；模板腔（常见于 AI 生成文字）→ 处理建议。
# 由 tools/stylecheck.py 读取；欢迎补充（PR）。每条：pattern（正则）、hint（建议）。
colloquial:
  - {pattern: "兔子", hint: "写“家兔”"}
  - {pattern: "老鼠", hint: "写“小鼠”或“大鼠”（按实际动物）"}
  - {pattern: "打(了)?(一?针|药)", hint: "写“给药”“注射”，并写明途径（如耳缘静脉注射）"}
  - {pattern: "扎针", hint: "写“穿刺”或“注射”"}
  - {pattern: "心跳", hint: "写“心率”（次/min）；描述节律时写“心搏”"}
  - {pattern: "(变|越)快", hint: "写“加快”“增快”，并给出数值变化"}
  - {pattern: "变慢", hint: "写“减慢”“减缓”，并给出数值变化"}
  - {pattern: "死掉|挂了", hint: "写“死亡”，并写明时间"}
  - {pattern: "肚子", hint: "写“腹部”“腹腔”"}
  - {pattern: "眼睛变小", hint: "瞳孔变化写“瞳孔缩小”，并给出直径（mm）"}
  - {pattern: "很(多|大|高|低|明显)", hint: "给出具体数值或相对变化（如增加 27.3%）"}
  - {pattern: "大概|大约左右|差不多", hint: "写测量值；确为估计值时写“约”"}
  - {pattern: "我们组|我们小组", hint: "报告通常用“本实验”“实验中”；确需主语时全文统一"}
template_tone:
  - {pattern: "值得注意的是|值得一提的是", hint: "删去，直接写要点"}
  - {pattern: "综上所述|总而言之|总的来说", hint: "结论部分直接写结论句；中间段落不用"}
  - {pattern: "不难发现|显而易见|众所周知", hint: "改为“如表 1 所示”“教材指出……”并给出依据"}
  - {pattern: "至关重要|具有重要意义|起着重要作用|发挥(着)?重要作用", hint: "说明“重要”在何处：影响哪个指标、幅度多大"}
  - {pattern: "深入(探讨|分析|研究)|全面(分析|阐述)", hint: "删去修饰语，直接写分析内容"}
  - {pattern: "赋能|助力|彰显|引领", hint: "实验报告不用此类词"}
  - {pattern: "在.{2,12}的背景下", hint: "改写为具体的条件或对象"}
  - {pattern: "不仅.{2,30}而且|不仅.{2,30}还", hint: "拆成两个陈述句，保留有数据支撑的那一半"}
  - {pattern: "首先.{0,80}其次.{0,80}(最后|再次)", hint: "三段式列举适度使用，每项应有各自依据"}
  - {pattern: "——", hint: "破折号过多读来像 AI 腔；改用逗号、句号或括号"}
  - {pattern: "一定程度上|某种程度上", hint: "能量化就量化；不能就写明不确定在哪里"}
  - {pattern: "充分(说明|证明|表明)", hint: "n 很小时不宜写“充分”；改为“提示”"}
