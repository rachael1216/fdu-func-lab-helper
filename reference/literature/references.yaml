  title: Management of acute organophosphorus pesticide poisoning
  journal: The Lancet
  year: 2008
  volume: "371"
  issue: "9612"
  pages: 597-607
  doi: 10.1016/S0140-6736(07)61202-1
  experiments: ["1.5"]
  keywords: [有机磷, 胆碱酯酶, 阿托品, 肟类复能剂, 胆碱能危象]
  key_points:
    - 综述有机磷农药中毒的处理：乙酰胆碱酯酶被抑制后胆碱能神经递质蓄积，出现毒蕈碱样、烟碱样和中枢症状。
    - 阿托品是抢救的基础药物；肟类复能剂的获益存在争议，需结合中毒的农药种类与就诊时间判断。
    - 强调气道、呼吸与循环支持。
  verified: {method: crossref, date: 2026-10-29}
