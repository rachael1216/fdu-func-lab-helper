<text x="1101.0" y="147" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">⑥ 排序</text>
<text x="1101.0" y="188" font-size="14" fill="#1A1A1A" text-anchor="middle">BM25 打分</text>
<text x="1101.0" y="215" font-size="14" fill="#1A1A1A" text-anchor="middle">取 top-k</text>
<text x="1101.0" y="242" font-size="14" fill="#1A1A1A" text-anchor="middle">附出处定位</text>
<rect x="14" y="284" width="1172" height="62" rx="6" fill="#fff" stroke="#4A4A4A" stroke-width="2.8"/>
<text x="600" y="310" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700">score(q,d) = sum_t idf(t) * f(t,d) * (k1 + 1) / ( f(t,d) + k1 * (1 - b + b * |d| / avgdl) )</text>
<text x="600" y="334" font-size="14" fill="#3D3D3D" text-anchor="middle">idf(t) = ln( 1 + (N - df + 0.5) / (df + 0.5) )　　k1 = 1.5，b = 0.75</text>
<line x1="600" y1="346" x2="600" y2="374" stroke="#1A1A1A" stroke-width="2.6" marker-end="url(#ar)"/>
