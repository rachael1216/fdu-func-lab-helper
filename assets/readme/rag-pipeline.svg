<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 570" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F5548"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/></filter>
<linearGradient id="hd" x1="0" x2="1"><stop offset="0" stop-color="#3F5548"/><stop offset="1" stop-color="#5F7568"/></linearGradient>
</defs>
<rect x="0" y="0" width="1240" height="570" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0" />
<rect x="0" y="0" width="1240" height="54" rx="0" fill="url(#hd)" stroke="none" stroke-width="0" />
<text x="24" y="34" font-size="20" fill="#fff" font-weight="700" text-anchor="start" >RAG 检索管线 · tools/rag.py</text>
<text x="1216" y="34" font-size="12.5" fill="#DCE6DF" font-weight="400" text-anchor="end" >词法检索（BM25）· 纯 Python · 每个结果带出处定位</text>
<text x="110" y="84" font-size="12.5" fill="#A67C52" font-weight="700" text-anchor="middle" >语料</text>
<rect x="20" y="96" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="116" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >textbook</text>
<text x="110.0" y="133" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >教材 PDF/分章文本</text>
<rect x="20" y="150" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="170" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >lecture</text>
<text x="110.0" y="187" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >讲义</text>
<rect x="20" y="204" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="224" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >corpus/local</text>
<text x="110.0" y="241" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >其他教材·文献全文</text>
<rect x="20" y="258" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="278" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >card</text>
<text x="110.0" y="295" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >知识卡</text>
<rect x="20" y="312" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="332" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >expr</text>
<text x="110.0" y="349" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >课本表述</text>
<rect x="20" y="366" width="180" height="48" rx="7" fill="#F5EDE3" stroke="#A67C52" stroke-width="1.1" filter="url(#sh)"/>
<text x="110.0" y="386" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle" >literature</text>
<text x="110.0" y="403" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >重点文献登记</text>
<rect x="236" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="310" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >① 读取</text>
<text x="310" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >pdf/docx/md/txt/yaml</text>
<text x="310" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >教材含页码范围</text>
<line x1="384" y1="208" x2="402" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="402" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="476" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >② 切片</text>
<text x="476" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >教材按【章节】</text>
<text x="476" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >md 按“## ”</text>
<text x="476" y="212" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >文献 1 条 1 片</text>
<text x="476" y="234" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >其余段落 ≤380 字</text>
<line x1="550" y1="208" x2="568" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="568" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="642" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >③ 分词</text>
<text x="642" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >中文：字二元组</text>
<text x="642" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >英文：小写词</text>
<text x="642" y="212" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >（无需词典/模型）</text>
<line x1="716" y1="208" x2="734" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="734" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="808" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >④ 建索引</text>
<text x="808" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >corpus/index/rag.json</text>
<text x="808" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >N · 平均长度 · df</text>
<text x="808" y="212" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >docs{corpus,source,</text>
<text x="808" y="234" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >exp,locator,text,tok}</text>
<line x1="882" y1="208" x2="900" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="900" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="974" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >⑤ 查询</text>
<text x="974" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >同样分词</text>
<text x="974" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >过滤：-c 语料标签</text>
<text x="974" y="212" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >　　　--exp 实验编号</text>
<line x1="1048" y1="208" x2="1066" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="1066" y="110" width="148" height="196" rx="10" fill="#E6EDF4" stroke="#4A6A8A" stroke-width="1.2" filter="url(#sh)"/>
<text x="1140" y="136" font-size="14" fill="#4A6A8A" font-weight="700" text-anchor="middle" >⑥ 排序</text>
<text x="1140" y="168" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle" >BM25  k1=1.5  b=0.75</text>
<text x="1140" y="190" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >idf=ln(1+(N−df+.5)/(df+.5))</text>
<text x="1140" y="212" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >取 top-k</text>
<line x1="200" y1="208" x2="236" y2="208" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<rect x="236" y="330" width="960" height="64" rx="10" fill="#E8EEE9" stroke="#5F7568" stroke-width="1.2" />
<text x="716" y="356" font-size="12.5" fill="#3F5548" font-weight="700" text-anchor="middle" >⑦ 返回：[序号] (语料标签) 来源 · 出处定位（如 实验3.1【原理】 p.124-125）· 片段  → 引用页码取自这里，不凭记忆</text>
<text x="716" y="378" font-size="11" fill="#5B6670" font-weight="400" text-anchor="middle" >--full 返回整段；--json 供脚本使用；找不到时明确提示“没有检索到”，不补全</text>
<line x1="1110" y1="306" x2="1110" y2="330" stroke="#3F5548" stroke-width="1.6"  marker-end="url(#ar)"/>
<text x="716" y="424" font-size="12.5" fill="#9A5B5B" font-weight="700" text-anchor="middle" >消费者</text>
<rect x="236" y="440" width="228" height="86" rx="9" fill="#fff" stroke="#9A5B5B" stroke-width="1.2" filter="url(#sh)"/>
<text x="350" y="464" font-size="12.5" fill="#9A5B5B" font-weight="700" text-anchor="middle" >fdu-lab-rag</text>
<text x="350" y="486" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >三步协议：expr → textbook → literature</text>
<text x="350" y="503" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >课本外内容找不到写“待核”</text>
<line x1="350" y1="394" x2="350" y2="440" stroke="#3F5548" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="478" y="440" width="228" height="86" rx="9" fill="#fff" stroke="#9A5B5B" stroke-width="1.2" filter="url(#sh)"/>
<text x="592" y="464" font-size="12.5" fill="#9A5B5B" font-weight="700" text-anchor="middle" >stylecheck.py</text>
<text x="592" y="486" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >句中二元组被某课本片段包含的比例</text>
<text x="592" y="503" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >≥0.60 过近 · &lt;0.15 缺依据</text>
<line x1="592" y1="394" x2="592" y2="440" stroke="#3F5548" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="720" y="440" width="228" height="86" rx="9" fill="#fff" stroke="#9A5B5B" stroke-width="1.2" filter="url(#sh)"/>
<text x="834" y="464" font-size="12.5" fill="#9A5B5B" font-weight="700" text-anchor="middle" >refcheck.py --offline</text>
<text x="834" y="486" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >对照 literature 登记表</text>
<text x="834" y="503" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >无需联网即可查书目</text>
<line x1="834" y1="394" x2="834" y2="440" stroke="#3F5548" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="962" y="440" width="228" height="86" rx="9" fill="#fff" stroke="#9A5B5B" stroke-width="1.2" filter="url(#sh)"/>
<text x="1076" y="464" font-size="12.5" fill="#9A5B5B" font-weight="700" text-anchor="middle" >rag.py export</text>
<text x="1076" y="486" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >导出带“第N章”标题的文本</text>
<text x="1076" y="503" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >→ 可选稠密检索 local-rag-cpp</text>
<line x1="1076" y1="394" x2="1076" y2="440" stroke="#3F5548" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="110" y="446" font-size="12" fill="#3F5548" font-weight="700" text-anchor="middle" >为什么是词法检索？</text>
<text x="110" y="466" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >术语类查询（“高钾血症”“复能剂”）</text>
<text x="110" y="483" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >词法匹配更稳、可复现、零依赖；</text>
<text x="110" y="500" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >代价：不懂同义改写 →</text>
<text x="110" y="517" font-size="10.5" fill="#5B6670" font-weight="400" text-anchor="middle" >语料里带术语表与关键词补偿</text>
</svg>